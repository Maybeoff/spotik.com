<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Спотик — скоро</title>
    <meta name="description" content="Спотик — сайт находится в разработке.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #242424 0%,
                    #111111 35%,
                    #080808 75%
                );

            color: #fff;
            overflow: hidden;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .glow {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.035);
            filter: blur(80px);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 650px;
            animation: appear 0.8s ease-out;
        }

        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 24px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px rgba(255, 255, 255, 0.08);

            font-size: 38px;
            font-weight: 800;
        }

        h1 {
            font-size: clamp(42px, 8vw, 76px);
            line-height: 1;
            letter-spacing: -0.055em;
            margin-bottom: 22px;
        }

        .subtitle {
            color: #a7a7a7;
            font-size: clamp(17px, 2.5vw, 21px);
            line-height: 1.6;
            margin-bottom: 34px;
        }

        .domain {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 11px 17px;
            border-radius: 999px;

            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);

            color: #d5d5d5;
            font-size: 14px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 12px rgba(255,255,255,.8);
            animation: pulse 2s infinite;
        }

        footer {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;

            text-align: center;

            color: #555;
            font-size: 13px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: .4;
                transform: scale(.8);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 600px) {
            .logo {
                width: 68px;
                height: 68px;
                border-radius: 20px;
                font-size: 31px;
                margin-bottom: 24px;
            }

            .subtitle {
                margin-bottom: 28px;
            }

            footer {
                bottom: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="glow"></div>

        <section class="content">

            <div class="logo">
                С
            </div>

            <h1>Спотик</h1>

            <p class="subtitle">
                Мы уже работаем над сайтом.<br>
                Скоро здесь будет кое-что интересное.
            </p>

            <div class="domain">
                <span class="dot"></span>
                spotik.com
            </div>

        </section>

        <footer>
            © 2026 Спотик
        </footer>

    </main>

</body>
</html>
